name: orderservice-stack

services:
  orderservice-app:
    image: orderservice
    container_name: orderservice-app
    environment:
      - _JAVA_OPTIONS=-Xmx384m -Xms128m -XX:TieredStopAtLevel=1 -Deureka.client.service-url.defaultZone=http://admin:admin@jhipster-registry:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:admin@jhipster-registry:8761/eureka/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin@jhipster-registry:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://admin:admin@jhipster-registry:8761/config
      - SPRING_DATASOURCE_URL=jdbc:postgresql://orderservice-postgresql:5432/orderservice
      - SPRING_DATASOURCE_USERNAME=orderservice
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://orderservice-postgresql:5432/orderservice
      - JHIPSTER_CACHE_REDIS_SERVER=redis://orderservice-redis:6379
      - JHIPSTER_CACHE_REDIS_CLUSTER=false
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=MzFiN2I0MTQ5MGE0ODEzYjFlNGVkYzQ5ZGQzNTU4MmM2MGI4YmFmMDIwN2QwZDIyYmIzMGFjYzQ2MDdkMGRjNTBmYzgxY2E5NjgyNDE0Y2U4N2FmMTY3ZTBmNGNjNTIzZjQwYjIyZDBmNjIzOTg0NTY4Y2QzZjkyM2UxNDdmNjQ=
    ports:
      - "8082:8082"
    depends_on:
      orderservice-postgresql:
        condition: service_healthy
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 512M

  orderservice-redis:
    image: redis:7.2-alpine
    container_name: orderservice-redis
    ports:
      - "6380:6379"
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 128M

  orderservice-postgresql:
    image: postgres:17.5
    container_name: orderservice-postgresql
    environment:
      - POSTGRES_USER=orderservice
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=orderservice
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  microservices-network:
    name: microservices-network
    external: true
