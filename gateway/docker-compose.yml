name: gateway-stack

services:
  gateway-app:
    image: gateway
    container_name: gateway-app
    environment:
      - _JAVA_OPTIONS=-Xmx384m -Xms128m -XX:TieredStopAtLevel=1
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:admin@jhipster-registry:8761/eureka
      - SPRING_CLOUD_CONFIG_URI=http://admin:admin@jhipster-registry:8761/config
      - SPRING_R2DBC_URL=r2dbc:postgresql://gateway-postgresql:5432/gateway
      - SPRING_R2DBC_USERNAME=gateway
      - SPRING_R2DBC_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://gateway-postgresql:5432/gateway
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=MzFiN2I0MTQ5MGE0ODEzYjFlNGVkYzQ5ZGQzNTU4MmM2MGI4YmFmMDIwN2QwZDIyYmIzMGFjYzQ2MDdkMGRjNTBmYzgxY2E5NjgyNDE0Y2U4N2FmMTY3ZTBmNGNjNTIzZjQwYjIyZDBmNjIzOTg0NTY4Y2QzZjkyM2UxNDdmNjQ=
    ports:
      - "8080:8080"
    depends_on:
      gateway-postgresql:
        condition: service_healthy
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 512M

  gateway-postgresql:
    image: postgres:17.5
    container_name: gateway-postgresql
    environment:
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  microservices-network:
    name: microservices-network
    external: true
