name: jhipster-dev-light

services:
  # 1. Netflix Eureka & Spring Cloud Config
  jhipster-registry:
    image: jhipster/jhipster-registry:v7.5.0
    container_name: jhipster-registry
    volumes:
      - ./gateway/src/main/docker/central-server-config:/central-config
    environment:
      - _JAVA_OPTIONS=-Xmx256m -Xms128m -XX:TieredStopAtLevel=1
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_USER_PASSWORD=admin
      - JHIPSTER_REGISTRY_PASSWORD=admin
      - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_TYPE=native
      - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_SEARCH_LOCATIONS=file:./central-config/localhost-config/
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. Redis dùng chung cho cả Product & Order Service
  redis:
    image: redis:7.2-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
